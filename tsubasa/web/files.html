<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/tsubasa.ico"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/files.css"><title>Workspace files · Tsubasa</title></head><body><header><nav><a href="/">Chat</a> · <a id="docs">Docs</a> · <a id="tables">Tables</a></nav><h1 id="title">Workspace files</h1></header>
<main><section><h2>Files in this workspace</h2><label>Import a copy <input type="file" id="upload" accept=".pdf,.docx,.xlsx,.csv,.tsv,.txt,.md"></label><p><label>Selected file <select id="file"></select></label> <button id="load">Load draft</button> <button id="download">Download</button> <button id="open">Open PDF in Washi</button></p></section>
<section id="document"><h2>Document editor</h2><label>Title <input id="doc-title"></label><p><label>Markdown<br><textarea id="markdown" rows="10" cols="72"></textarea></label></p><button id="create-doc">Create draft</button> <button id="edit-doc">Save selected draft</button></section>
<section id="table"><h2>Table editor</h2><label>Table name <input id="table-name"></label><p><label>Column headings, separated by tabs<br><textarea id="cols" rows="1" cols="72"></textarea></label></p><label>Rows, with cells separated by tabs<br><textarea id="rows" rows="7" cols="72"></textarea></label><p><button id="create-table">Create table</button></p><label>Row <input type="number" min="1" value="1" id="row"></label> <label>Column <input type="number" min="1" value="1" id="col"></label> <label>New value <input id="cell"></label> <button id="edit-table">Update cell</button></section>
<section><h2>Export or convert</h2><p><label>Output filename, including extension <input id="out"></label></p><button id="export">Export selected draft</button> <button id="targets">Find conversion formats</button> <label>Target <select id="target"></select></label> <button id="convert">Convert selected file</button></section>
<section><h2>PDF tools</h2><label>Pages or range <input id="pages" value="1"></label> <button id="read">Read</button> <button id="render">Preview one page</button> <button id="extract">Extract to output</button><p><label>Find text <input id="query"></label> <button id="search">Search</button></p><label>Merge filenames in order, one per line<br><textarea rows="3" cols="60" id="merge-list"></textarea></label> <button id="merge">Merge to output</button></section>
<p role="status" id="status"></p><pre id="result"></pre><img alt="Rendered PDF page" id="preview" hidden></main><script src="/files.js"></script><script type="module" src="/shell.js"></script></body></html>
