<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/tsubasa.ico"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/files.css"><title>Audio · Tsubasa</title></head><body><header><a href="/">Chat</a><h1>Audio transcription</h1><p>Transcribe speech or sung words from a workspace recording or video.</p></header><main><section><h2>Recording</h2><label>Import a copy <input type="file" id="upload" accept=".wav,.mp3,.flac,.ogg,.m4a,.mp4,.mov,.mkv,.webm"></label><p>Up to 8 MiB and two minutes. Files stay in this workspace.</p><label>Workspace file <select id="file"></select></label> <label>Language <select id="language"><option value="auto">Automatic</option><option value="sk">Slovak</option><option value="en">English</option></select></label><p><button id="run">Transcribe</button> <button id="cancel" disabled>Cancel</button></p></section><section><h2>Transcript</h2><p role="status" id="status"></p><label>Recognized words<textarea id="text" rows="9" readonly></textarea></label><button id="copy" disabled>Copy transcript</button></section></main><script src="/audio.js"></script><script type="module" src="/shell.js"></script></body></html>
