<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/tsubasa.ico"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/files.css"><title>Terminal · Tsubasa</title></head><body class="terminal"><header><a href="/">Chat</a><h1>Project terminal</h1><p>Read and edit small project files, run a reviewed PowerShell command, or calculate a Python expression.</p></header><main><section><h2>Operation</h2><form id="form"><label>Action <select id="op"><option value="ps_run">PowerShell template</option><option value="py_run">Python expression</option><option value="fs_read">Read file</option><option value="fs_write">Write file</option></select></label><p id="templates"><label>Template <select id="template"></select></label></p><p id="file-field" hidden><label>Project filename <input id="path" value="notes.txt"></label></p><label id="code-field"><span id="code-label">Command</span><textarea id="code" rows="5" maxlength="4000" spellcheck="false"></textarea></label><p id="help"></p><button id="submit">Review and run</button> <button type="button" id="cancel" disabled>Cancel</button></form></section><section><h2>Output</h2><p role="status" id="status"></p><pre id="output"></pre></section></main><dialog id="approval" aria-labelledby="review-heading"><h2 id="review-heading">Review this operation</h2><pre id="preview"></pre><form method="dialog"><button value="deny" autofocus>Deny</button> <button value="allow">Allow once</button></form></dialog><script src="/terminal.js"></script><script type="module" src="/shell.js"></script></body></html>
