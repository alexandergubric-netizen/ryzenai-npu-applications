<!doctype html>
<html lang="en" data-edition="{{EDITION}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="postura-token" content="{{TOKEN}}">
<meta name="postura-version" content="{{VERSION}}">
<meta name="postura-assistant" content="{{ASSISTANT}}">
<title>Postura</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash">
  <div class="sp-stripes"><i></i><i></i><i></i></div>
  <div class="sp-in">
    <div class="sp-logo" id="spLogo"></div>
    <h1>Postura</h1>
    <p id="spTag">Sit well. Rest your eyes. Keep moving.</p>
  </div>
</div>
<div class="shell" id="shell">
  <aside class="side">
    <div class="brand"><div class="logo" id="brandLogo"></div><div><b>Postura</b><small id="brandSub">Posture &amp; eye care</small></div><button class="side-toggle" id="sideToggle" title="Fold the sidebar" aria-label="Fold the sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="askFoot" title="Ask the assistant">
      <div class="av" id="footAv"></div>
      <div><b id="footName"></b><span>Ask me anything</span></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
