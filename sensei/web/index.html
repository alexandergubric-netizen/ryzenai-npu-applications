<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensei</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script>window.SENSEI_TOKEN = "__TOKEN__";</script>
</head>
<body>
<!-- splash: the logo tile pops in, the prompt is drawn and the cursor starts blinking -->
<div id="splash" aria-hidden="true">
  <div class="paper"></div>
  <svg class="logo" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7AA2FF"/><stop offset="1" stop-color="#465CE6"/></linearGradient>
    </defs>
    <rect x="40" y="40" width="944" height="944" rx="230" fill="url(#sg)"/>
    <path class="chev" d="M 270 330 L 470 512 L 270 694" fill="none" stroke="#0D1530" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="cursor" x="540" y="650" width="240" height="92" rx="46" fill="#FFFFFF"/>
  </svg>
  <div class="word">Sensei <span>2</span></div>
  <div class="motto">Ask in plain words. Get the exact command.</div>
</div>

<header class="top">
  <div class="brand">
    <img src="logo.svg" alt="" class="mark">
    <span class="name">Sensei</span><span class="ver" id="ver">2.0</span>
  </div>
  <button class="status" id="status" title="FastFlowLM on the NPU">
    <span class="dot"></span><span id="status-text">starting…</span>
  </button>
  <button class="icon-btn" id="library-btn" title="Library: everything Sensei knows (Ctrl+L)" aria-label="Library">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7M8 11h5"/></svg>
  </button>
  <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/></svg>
  </button>
  <div class="popover" id="settings" hidden>
    <label class="row">
      <span>AI model</span>
      <select id="set-model"></select>
    </label>
    <div class="row muted small" id="model-note"></div>
    <label class="row">
      <span>NPU power mode</span>
      <select id="set-pmode"><option>powersaver</option><option>balanced</option><option>performance</option><option>turbo</option></select>
    </label>
    <label class="row switch">
      <span>Run read-only library commands automatically (AI-written ones always wait for you)</span>
      <input type="checkbox" id="set-autorun">
    </label>
    <label class="row switch">
      <span>Let the AI pick tested tools first</span>
      <input type="checkbox" id="set-router">
    </label>
    <div class="row muted small" id="set-info"></div>
    <div class="row actions">
      <button class="btn ghost" id="open-terminal">Open terminal here</button>
      <button class="btn ghost" id="clear-feed">Clear</button>
    </div>
  </div>
</header>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div class="drawer-title">Library <span id="lib-count"></span></div>
    <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <input id="lib-search" type="search" placeholder="Search tasks… (volume, wifi, zip, delete…)" spellcheck="false">
  <div class="lib-cats" id="lib-cats"></div>
  <div class="lib-list" id="lib-list"></div>
</aside>

<main id="feed"></main>

<footer class="composer">
  <div class="cwd" id="cwd" title="Current folder of the built-in PowerShell session"></div>
  <div class="bar" id="bar">
    <button class="mode" id="mode" title="Tab switches between asking and typing PowerShell">Ask</button>
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off" placeholder="e.g. move my photos from Downloads to Pictures"></textarea>
    <button class="send" id="send" title="Enter" aria-label="Send">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="hints"><span><kbd>Enter</kbd> ask</span><span><kbd>Tab</kbd> PowerShell</span><span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> run</span><span><kbd>Ctrl</kbd>+<kbd>L</kbd> library</span><span><kbd>Esc</kbd> stop</span></div>
</footer>

<svg width="0" height="0" style="position:absolute">
  <symbol id="enso" viewBox="0 0 40 40"><path d="M 30 9 A 14 14 0 1 0 33 24" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/></symbol>
</svg>
<script src="app.js"></script>
</body>
</html>
